name: migraine_tracker
description: Application mobile de suivi et d'analyse des migraines
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.10

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # UI Components
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6
  flutter_native_splash: ^2.3.7
  flutter_launcher_icons: ^0.13.1

  # Navigation
  go_router: ^13.0.1

  # Forms
  flutter_form_builder: ^7.7.0
  form_builder_validators: ^9.0.0

  # Date & Time
  intl: ^0.18.1
  date_time_picker: ^2.1.0
  table_calendar: ^3.0.9

  # Charts & Graphs
  fl_chart: ^0.63.0
  syncfusion_flutter_charts: ^24.1.47
  syncfusion_flutter_calendar: ^24.1.47

  # PDF & Export
  pdf: ^3.10.7
  printing: ^5.11.1
  csv: ^5.1.1
  share_plus: ^7.2.1
  file_picker: ^6.1.1

  # Notifications
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2

  # Health Integration
  health: ^10.0.0
  permissions: ^1.0.0

  # Weather
  http: ^1.2.0
  weather: ^3.1.0

  # AI & Chat
  # (Will use custom implementation with HTTP)

  # Storage
  shared_preferences: ^2.2.2
  path: ^1.8.3

  # Utilities
  uuid: ^4.2.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  collection: ^1.18.0

  # Localization
  flutter_localizations:
    sdk: flutter

  # Icons
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#f5f7fa"
  image: assets/images/splash_logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#f5f7fa"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
